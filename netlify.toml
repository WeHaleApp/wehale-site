[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node 20 so the build environment matches our local dev.
  # Astro 5 + Tailwind v4 work on 18.20.8+ but 20 is safer.
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Astro hashes filenames in /_astro/ so 1-year immutable cache is safe.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Universal links: proof that the app owns wehale.io/session/* links. Invisible —
# it adds no page and changes nothing anyone sees. It only works paired with
# associatedDomains in wehale-app's app.json; neither half does anything alone.
#
# The file has no extension on purpose, so its content type is pinned here:
# Serve JSON directly over HTTPS; the association-file URL must not redirect.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Browser fallback, including no app, older app versions, and an explicit browser
# preference. The front page carries the store links; installation does not retain
# the requested session (deferred deep linking is outside this change).
[[redirects]]
  from = "/session/*"
  to = "/"
  status = 302

# A short, readable link to ask someone for a store review: wehale.io/review.
#
# WHY NOT PASTE THE STORE URL. Mail clients rewrite links through their own
# redirector, and a long `apps.apple.com/...?action=write-review` arriving that way
# can surface a browser interstitial showing an unfamiliar URL — exactly the wrong
# note in a personal message from a founder. Our own short domain reads as ours, and the
# last hop is still Apple's, so iOS hands off to the App Store and opens the review
# sheet rather than the product page.
#
# `force = true` because these paths have no page of their own to lose to.
[[redirects]]
  from = "/review"
  to = "https://apps.apple.com/app/id6739413667?action=write-review"
  status = 302
  force = true

# Google Play has no write-a-review deep link, so this is the listing; the rating
# control sits on it. Kept separate rather than sniffing the user agent: the sender
# knows which store the person is on, and a guess that lands an iPhone user on Play
# is worse than two links.
[[redirects]]
  from = "/review/android"
  to = "https://play.google.com/store/apps/details?id=com.wehale.app"
  status = 302
  force = true
