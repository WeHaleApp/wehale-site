[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node 20 so the build environment matches our local dev.
  # Astro 5 + Tailwind v4 work on 18.20.8+ but 20 is safer.
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Astro hashes filenames in /_astro/ so 1-year immutable cache is safe.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Universal links: proof that the app owns wehale.io/session/* links. Invisible —
# it adds no page and changes nothing anyone sees. It only works paired with
# associatedDomains in wehale-app's app.json; neither half does anything alone.
#
# The file has no extension on purpose, so its content type is pinned here:
# Apple rejects a guessed one, fetches it exactly once, and follows no redirect.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Only ever reached by somebody WITHOUT the app. With it, iOS opens the session
# before any request leaves the phone. Sent to the front page, which already
# carries the App Store link, rather than adding a page to the site.
[[redirects]]
  from = "/session/*"
  to = "/"
  status = 302
